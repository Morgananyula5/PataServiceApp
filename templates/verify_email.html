<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #5865F2 0%, #4B4CB5 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            transition: background 0.5s ease;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.02em;
            animation: fadeIn 0.5s ease-in;
        }
        form {
            background: linear-gradient(145deg, #2C2F33 0%, #23272A 100%);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        form:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            color: #e0e0e0;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1.2rem;
            border: 1px solid #40444B;
            border-radius: 8px;
            background-color: #1E2124;
            color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #7289DA;
            box-shadow: 0 0 8px rgba(114, 137, 218, 0.5);
        }
        input::placeholder {
            color: #72767d;
        }
        button {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            background-color: #7289DA;
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #5B6EAE;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background-color: #4B5EAA;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .alert {
            margin-bottom: 1.2rem;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            list-style: none;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease;
        }
        .alert-error {
            background-color: #FF6F61;
            color: #ffffff;
        }
        .alert-success {
            background-color: #43B581;
            color: #ffffff;
        }
        p {
            margin-top: 1.5rem;
            font-size: 1rem;
        }
        a {
            color: #7289DA;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #8EA1E1;
            text-decoration: underline;
        }
        .resend-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .spinner {
            display: none;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid #7289DA;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Mobile responsiveness */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 1rem;
                position: sticky;
                top: 1rem;
                z-index: 10;
                background: linear-gradient(135deg, #5865F2 0%, #4B4CB5 100%);
                padding: 0.5rem 0;
                width: 100%;
                max-width: 90%;
                margin-left: auto;
                margin-right: auto;
            }
            form {
                max-width: 90%;
                padding: 1.5rem;
                border-radius: 10px;
                position: sticky;
                top: calc(3.8rem + 1rem); /* Adjust based on h1 height + margin */
                z-index: 9;
            }
            input, button {
                padding: 0.7rem;
                font-size: 0.95rem;
                border-radius: 6px;
            }
            .alert {
                padding: 0.7rem;
                font-size: 0.9rem;
            }
            p {
                font-size: 0.9rem;
            }
            .resend-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <h1>Verify Your Email</h1>

    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li class="alert alert-{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('verify_email') }}" method="POST">
        <label for="code">Verification Code:</label>
        <input type="text" id="code" name="code" required placeholder="Enter the 6-digit code" pattern="[0-9]{6}" title="Please enter a 6-digit code">

        <button type="submit">Verify</button>
    </form>

    <p class="resend-container">Didn't receive a code? <a href="#" id="resendLink" onclick="resendVerification()">Resend Code</a> <span class="spinner" id="spinner"></span></p>

    <script>
        function resendVerification() {
            const resendLink = document.getElementById('resendLink');
            const spinner = document.getElementById('spinner');
            resendLink.style.pointerEvents = 'none';
            resendLink.style.opacity = '0.7';
            spinner.style.display = 'inline-block';

            fetch('{{ url_for("resend_verification") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                resendLink.style.pointerEvents = 'auto';
                resendLink.style.opacity = '1';
                spinner.style.display = 'none';
                if (data.success) {
                    alert(data.message);
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                resendLink.style.pointerEvents = 'auto';
                resendLink.style.opacity = '1';
                spinner.style.display = 'none';
                alert('Error resending verification code: ' + error);
            });
        }
    </script>
</body>
</html>
