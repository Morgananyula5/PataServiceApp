<div class="star-rating-container" id="starRatingContainer">
    <div class="star-rating" id="overallRating">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>
    <div class="rating-glow"></div>
  </div>
  
  <style>
    .star-rating-container {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: linear-gradient(135deg, rgba(90, 62, 149, 0.3), rgba(58, 42, 106, 0.3));
      border-radius: 15px;
      box-shadow: inset 0 0 10px rgba(166, 140, 217, 0.2), 0 0 20px rgba(75, 44, 130, 0.3);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
  
    .star-rating-container:hover {
      transform: scale(1.05);
      box-shadow: inset 0 0 15px rgba(166, 140, 217, 0.4), 0 0 30px rgba(75, 44, 130, 0.5);
    }
  
    .star-rating {
      display: flex;
      justify-content: center;
      gap: 8px;
      position: relative;
      z-index: 2;
    }
  
    .star {
      font-size: 35px;
      color: #2c2c2c;
      cursor: pointer;
      transition: transform 0.3s ease, color 0.2s ease, text-shadow 0.3s ease;
      position: relative;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }
  
    .star:hover,
    .star.filled,
    .star.half-filled {
      color: #ffd700;
      transform: scale(1.2) rotate(10deg);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5);
    }
  
    .star.half-filled::before {
      content: '★';
      position: absolute;
      color: #ffd700;
      width: 50%;
      overflow: hidden;
      left: 0;
      top: 0;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      animation: halfStarGlow 1.5s infinite ease-in-out;
    }
  
    @keyframes halfStarGlow {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  
    .star:hover ~ .star {
      color: #2c2c2c;
      transform: scale(1);
      text-shadow: none;
    }
  
    .rating-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent 70%);
      transform: translate(-50%, -50%);
      opacity: 0;
      z-index: 1;
      transition: opacity 0.5s ease;
    }
  
    .star-rating-container:hover .rating-glow {
      opacity: 0.5;
    }
  
    .star.filled::after,
    .star.half-filled::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.3), transparent);
      top: 0;
      left: 0;
      z-index: -1;
      animation: starPulse 2s infinite ease-in-out;
    }
  
    @keyframes starPulse {
      0% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.5; }
    }
  </style>
  
  <script>
    function initStarRating() {
      const stars = document.querySelectorAll('#overallRating .star');
      let currentRating = 0;
  
      stars.forEach(star => {
        star.addEventListener('click', (e) => {
          const value = parseFloat(e.target.dataset.value);
          currentRating = value;
          updateStars(currentRating);
        });
  
        star.addEventListener('mouseover', (e) => {
          const value = parseFloat(e.target.dataset.value);
          updateStars(value);
        });
  
        star.addEventListener('mouseout', () => {
          updateStars(currentRating);
        });
  
        star.addEventListener('mousemove', (e) => {
          const rect = e.target.getBoundingClientRect();
          const offsetX = e.clientX - rect.left;
          const halfStar = offsetX < rect.width / 2;
          const value = parseFloat(e.target.dataset.value);
          const displayValue = halfStar ? value - 0.5 : value;
          updateStars(displayValue);
        });
  
        star.addEventListener('click', (e) => {
          const rect = e.target.getBoundingClientRect();
          const offsetX = e.clientX - rect.left;
          const halfStar = offsetX < rect.width / 2;
          currentRating = halfStar ? parseFloat(e.target.dataset.value) - 0.5 : parseFloat(e.target.dataset.value);
          updateStars(currentRating);
        });
      });
  
      function updateStars(rating) {
        stars.forEach(star => {
          const starValue = parseFloat(star.dataset.value);
          star.classList.remove('filled', 'half-filled');
          star.style.color = '#2c2c2c';
          if (rating >= starValue) {
            star.classList.add('filled');
            star.style.color = '#ffd700';
          } else if (rating >= starValue - 0.5) {
            star.classList.add('half-filled');
            star.style.color = '#ffd700';
          }
        });
      }
    }
  
    document.addEventListener('DOMContentLoaded', initStarRating);
  </script>
